name: 'SonarCloud and Mutation Tests (PR - changed code only)'

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches:
      - main

env:
  SOLUTION_FILE: 'demo-dotnet-mutation-tests-stryker.slnx'

  # Set up the .NET environment to improve test performance and reliability
  DOTNET_CLI_TELEMETRY_OPTOUT: true # Disable .NET CLI telemetry
  DOTNET_NOLOGO: true # Disable .NET CLI logo
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true # Enable ANSI color redirection
  TERM: xterm # Enable ANSI color redirection
  NUGET_XMLDOC_MODE: skip # Disable NuGet XML documentation generation

  SONAR_ORGANIZATION: 'nelsonbn'
  SONAR_PROJECT_KEY: 'demo-dotnet-mutation-tests-stryker'

permissions: {}

concurrency:
  group: pr-mutations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sonar-scanner:
    name: "Sonar Scanner and Mutation Tests"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # To can create a comment with the results

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

    - name: "Fetch PR base branch"
      run: |
        git fetch origin +${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}

    # Stryker's --since is not used: in --solution mode it treats every changed file as a test file (see README)
    - name: "Detect mutation targets"
      id: changes
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        MUTATE_FILE: ${{ runner.temp }}/mutate-files.txt
      run: |
        bash .github/scripts/detect-mutation-targets.sh "origin/$BASE_REF" "$MUTATE_FILE" | tee -a "$GITHUB_STEP_SUMMARY"
        if [[ -s "$MUTATE_FILE" ]]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi

    - name: "Define branch name for Stryker"
      env:
        GH_HEAD_REF: ${{ github.head_ref }}
        GH_RUN_NUMBER: ${{ github.run_number }}
      run: |
        # Sanitize branch name
        SAFE_HEAD_REF="$(printf '%s' "$GH_HEAD_REF" | tr -c 'A-Za-z0-9._-' '-')"
        printf 'STRYKER_BRANCH=%s-%s\n' "$SAFE_HEAD_REF" "$GH_RUN_NUMBER" >> "$GITHUB_ENV"

    - name: "Display branch name for Stryker"
      run: echo "Stryker branch is '${{ env.STRYKER_BRANCH }}'"

    - name: "Setup .NET"
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: 'global.json'

    - name: "Set up JDK"
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: "Restore .NET Tools"
      run: dotnet tool restore

    - name: "Create cache directory"
      run: mkdir -p ~/sonar/cache

    - name: "Cache SonarCloud packages"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/sonar/cache
        key: ${{ runner.os }}-sonar-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-sonar-
          ${{ runner.os }}-

    - name: "Cache SonarCloud scanner"
      id: cache-sonar-scanner
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ./.sonar/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: "Install SonarCloud scanner"
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      run: |
        mkdir -p ./.sonar/scanner
        dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
        dotnet tool update dotnet-coverage --tool-path ./.sonar/scanner

    - name: "Run Stryker (changed code only)"
      # Never run without targets: no --mutate means Stryker mutates the whole solution
      if: steps.changes.outputs.has_changes == 'true'
      shell: bash
      env:
        MUTATE_FILE: ${{ runner.temp }}/mutate-files.txt
      run: |
        mutate_args=()
        while IFS= read -r glob; do
          mutate_args+=(--mutate "$glob")
        done < "$MUTATE_FILE"

        dotnet stryker \
          --solution ${{ env.SOLUTION_FILE }} \
          "${mutate_args[@]}" \
          --reporter json \
          --reporter cleartext \
          --reporter markdown \
          --reporter html \
          --version ${{ env.STRYKER_BRANCH }} \
          -O ${{ github.workspace }}/mutations

    - name: "Convert report to Sonar"
      if: steps.changes.outputs.has_changes == 'true'
      run: jq -f tests/mutation-report-to-sonar.jq '${{ github.workspace }}/mutations/reports/mutation-report.json' > '${{ github.workspace }}/mutations/reports/mutation-sonar.json'

    - name: "Locate mutation report"
      if: steps.changes.outputs.has_changes == 'true'
      id: locate-report
      shell: bash
      run: echo "path=$(find ${{ github.workspace }}/mutations/reports/* -name "*.md")" >> "$GITHUB_OUTPUT"

    - name: "Publish report"
      if: steps.changes.outputs.has_changes == 'true'
      run: cat "${{ steps.locate-report.outputs.path }}" >> $GITHUB_STEP_SUMMARY

    - name: "Add Stryker Report in PR Comment"
      if: steps.changes.outputs.has_changes == 'true'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
      with:
        header: stryker-report
        hide_and_recreate: true
        hide_classify: "OUTDATED"
        path: ${{ steps.locate-report.outputs.path }}

    - name: "Upload Html report as artifact"
      if: steps.changes.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v6.0.0
      with:
        retention-days: 7
        name: mutation-tests-report
        path: ${{ github.workspace }}/mutations/reports/mutation-report.html

    - name: "Skip mutation tests"
      if: steps.changes.outputs.has_changes != 'true'
      run: echo "Mutation tests skipped - no changed source or test code." >> $GITHUB_STEP_SUMMARY

    - name: "Build and analyze"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        MUTATION_SONAR_REPORT: ${{ github.workspace }}/mutations/reports/mutation-sonar.json
      run: |
        sonar_args=()
        # Check the file itself, not just has_changes: earlier steps may have failed/skipped despite it being 'true'
        if [[ -f "$MUTATION_SONAR_REPORT" ]]; then
          sonar_args+=(/d:sonar.externalIssuesReportPaths="$MUTATION_SONAR_REPORT")
        fi
        ./.sonar/scanner/dotnet-sonarscanner begin \
          /k:"${{ env.SONAR_PROJECT_KEY }}" \
          /o:"${{ env.SONAR_ORGANIZATION }}" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
          /d:sonar.vstest.reportsPaths="**/*.trx" \
          /d:sonar.projectBaseDir="$(pwd)" \
          /d:sonar.scanner.scanAll=false \
          /d:sonar.cs.analyzeRazorCode=false \
          /d:sonar.cs.analyzeGeneratedCode=false \
          /d:sonar.cs.file.suffixes=.cs \
          /d:sonar.githubactions.activate=true \
          "${sonar_args[@]}" \
          /d:sonar.pullrequest.key="${{ github.event.pull_request.number }}" \
          /d:sonar.pullrequest.branch="${{ github.head_ref }}" \
          /d:sonar.pullrequest.base="${{ github.event.pull_request.base.ref }}"
        dotnet build ${{ env.SOLUTION_FILE }} -c Release --no-incremental
        ./.sonar/scanner/dotnet-coverage collect "dotnet test ${{ env.SOLUTION_FILE }} -c Release --no-restore --no-build --logger trx" -f xml -o "coverage.xml"
        ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
